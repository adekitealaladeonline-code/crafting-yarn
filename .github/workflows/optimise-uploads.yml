name: Optimise uploaded photos

# Freda uploads photos straight from her phone (4000px, several MB). Those files
# are what the CMS media library loads as thumbnails, so big originals make the
# picture picker slow and unreliable for her.
#
# This shrinks any oversized photo IN THE REPO right after she publishes, and
# commits the smaller version back. Commits made with GITHUB_TOKEN don't
# re-trigger workflows, so this can't loop.

on:
  push:
    branches: [main]
    paths:
      - "assets/**"

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Shrink oversized photos
        run: node scripts/optimise-assets.js

      # optimise-video.js skips silently without ffmpeg, which would ship a phone
      # sized clip. Make sure it is there rather than relying on the runner image.
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Shrink uploaded videos and make poster frames
        run: node scripts/optimise-video.js

      - name: Commit if anything changed
        run: |
          if [[ -n "$(git status --porcelain assets data/products)" ]]; then
            git config user.name  "crafting-yarn bot"
            git config user.email "actions@github.com"
            git add assets data/products
            git commit -m "Auto-optimise uploaded photos and videos for the web"
            git push
          else
            echo "nothing to optimise"
          fi
