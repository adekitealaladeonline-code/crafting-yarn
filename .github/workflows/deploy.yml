name: Build & deploy to Cloudflare Pages

# Runs whenever the CMS (or you) push to main — i.e. every time Freda hits "Publish"
# in /admin — and also on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The optimiser commits its work with GITHUB_TOKEN, and GitHub deliberately
  # refuses to start a new workflow run from such a commit. Without this trigger
  # a photo it shrank, or a video path it repointed after converting a .mov,
  # would sit in the repo undeployed until Freda happened to save something else.
  workflow_run:
    workflows: ["Optimise uploaded photos"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # don't redeploy off the back of an optimiser run that failed
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the build can date products from git

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # sharp (image optimisation) is the only dependency — everything else is
      # plain Node. Freda uploads full-size phone photos, so the build shrinks
      # them for the web automatically; without this step they'd ship at ~4000px.
      - name: Install dependencies
        run: npm ci

      - name: Build site (data/products -> dist/)
        run: npm run build

      # Direct-upload the built dist/ to the existing Pages project (keeps the
      # domain + STRIPE_SECRET_KEY that already live on that project).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=crafting-yarn --branch=main
