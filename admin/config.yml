# Crafting Yarn — admin (Sveltia/Decap CMS) config.
# Edits the per-product files in data/products/ and uploads photos to assets/products/.
# A git commit from here triggers a Cloudflare Pages rebuild (npm run build) -> live in ~1 min.

backend:
  name: github
  repo: adekitealaladeonline-code/crafting-yarn
  branch: main
  # Login: use "Sign In Using Access Token" with a GitHub fine-grained token — no OAuth setup needed.
  # (Optional nicer "Sign In with GitHub" button needs an OAuth worker + a base_url here; see SETUP-ADMIN.md.)

# Uploaded photos land here. public_folder uses a leading slash (CMS convention);
# build.js normalises it back to a site-relative path.
media_folder: "assets/products"
public_folder: "/assets/products"

site_url: https://craftingyarn.com
display_url: https://craftingyarn.com
logo_url: /assets/brand/logo.png
publish_mode: simple
locale: en

collections:
  - name: products
    label: "Products"
    label_singular: "Product"
    description: "Add, edit, hide or reorder the items in the shop. Changes go live a minute or so after you publish."
    editor: { preview: false }
    folder: "data/products"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"           # filename (= the product's web address) is made from the name
    identifier_field: name
    summary: "{{name}} · AED {{sale}}"
    sortable_fields: [order, name, price]
    fields:
      - { name: name, label: "Name", widget: string, hint: "Shown on the card and the product page." }
      - { name: category, label: "Category", widget: select, options: ["Bags", "Accessories"] }
      - { name: subcategory, label: "Subcategory", widget: string, required: false }
      - { name: price, label: "Original price (AED)", widget: number, value_type: float, min: 0, step: 1 }
      - { name: sale, label: "Sale price (AED)", widget: number, value_type: float, min: 0, step: 1, required: false, hint: "Set a lower price to put this item on sale — it shows a discount badge and appears on the Sale page automatically. Leave blank if it's not on sale." }
      - { name: stock, label: "Stock", widget: number, value_type: int, min: 0, step: 1, required: false, hint: "How many finished pieces you have. It counts down automatically as orders are paid, and shows 'Sold out' at zero. Leave blank for made-to-order (always available)." }
      - name: images
        label: "Photos"
        widget: list
        field: { name: image, label: "Photo", widget: image }
        min: 1
        hint: "Add as many photos as you like — drag to reorder. The first is the main photo; the second shows when someone hovers the card."
      - { name: desc, label: "Description", widget: text }
      - { name: featured, label: "Highlight in the shop", widget: boolean, default: false, hint: "Bumps this item toward the top of the shop's default 'Featured' view." }
      - { name: isNew, label: "Show a 'New' badge", widget: boolean, default: false }
      - { name: order, label: "Sort order", widget: number, value_type: int, default: 999, hint: "Lower numbers show first. (10, 20, 30 …)" }
      - { name: created, label: "Date added", widget: datetime, default: "{{now}}", required: false, hint: "Set automatically when you add a product. This controls the 'Fresh off the hook' carousel — newest first. You can back-date it to push something down." }

  - name: pages
    label: "Site text"
    description: "Edit the wording on the About, Shipping, Returns, Care and Contact pages."
    editor: { preview: false }
    files:
      - name: care
        label: "Care guide"
        file: "data/pages/care.md"
        fields:
          - { name: eyebrow, label: "Small label above the title", widget: string, required: false }
          - { name: heading, label: "Title", widget: string }
          - { name: body, label: "Text", widget: markdown }
          - { name: description, label: "Search description (for Google)", widget: string, required: false }
      - name: about
        label: "About / Our story"
        file: "data/pages/about.md"
        fields:
          - { name: eyebrow, label: "Small label above the title", widget: string, required: false }
          - { name: heading, label: "Title", widget: string }
          - { name: image, label: "Photo", widget: image, required: false }
          - { name: body, label: "Story", widget: markdown }
          - { name: signature, label: "Sign-off (e.g. — Freda)", widget: string, required: false }
          - { name: description, label: "Search description (for Google)", widget: string, required: false }
      - name: shipping
        label: "Shipping page"
        file: "data/pages/shipping.md"
        fields:
          - { name: eyebrow, label: "Small label above the title", widget: string, required: false }
          - { name: heading, label: "Title", widget: string }
          - { name: body, label: "Text", widget: markdown }
          - { name: description, label: "Search description (for Google)", widget: string, required: false }
      - name: returns
        label: "Returns page"
        file: "data/pages/returns.md"
        fields:
          - { name: eyebrow, label: "Small label above the title", widget: string, required: false }
          - { name: heading, label: "Title", widget: string }
          - { name: body, label: "Text", widget: markdown }
          - { name: description, label: "Search description (for Google)", widget: string, required: false }
      - name: contact
        label: "Contact page"
        file: "data/pages/contact.md"
        fields:
          - { name: eyebrow, label: "Small label above the title", widget: string, required: false }
          - { name: heading, label: "Title", widget: string }
          - { name: body, label: "Intro text (the contact form appears below it)", widget: markdown }
          - { name: form, label: "Show contact form", widget: hidden, default: true }
          - { name: description, label: "Search description (for Google)", widget: string, required: false }
      - name: success
        label: "Thank-you page (after checkout)"
        file: "data/pages/success.json"
        fields:
          - { name: eyebrow, label: "Small label above the title", widget: string, default: "Order received" }
          - { name: title, label: "Big title", widget: text, hint: "Press Return to split it onto two lines." }
          - { name: lead, label: "Main message", widget: text }
          - { name: note, label: "Small note underneath", widget: text, hint: "Your Instagram link is added at the end automatically." }
          - { name: button, label: "Button text", widget: string, default: "Continue shopping" }

  - name: homepage
    label: "Homepage"
    description: "The landing page — change the big photos, headlines and buttons. Changes go live a minute after you publish."
    editor: { preview: false }
    files:
      - name: homepage
        label: "Homepage"
        file: "data/homepage.json"
        fields:
          - name: hero
            label: "Top banner (first thing visitors see)"
            widget: object
            fields:
              - { name: image, label: "Photo", widget: image }
              - { name: title, label: "Headline", widget: text, hint: "Press Return to split it onto two lines." }
              - { name: button, label: "Button text", widget: string, default: "Shop now" }
              - name: style
                label: "Text colour"
                widget: select
                default: "light"
                options:
                  - { label: "Dark text (best on pale photos)", value: "light" }
                  - { label: "White text (best on darker photos)", value: "dark" }
          - name: banners
            label: "Collection banners"
            label_singular: "banner"
            widget: list
            hint: "The big photo panels down the homepage. Add, remove or drag to reorder."
            fields:
              - { name: image, label: "Photo", widget: image }
              - { name: eyebrow, label: "Small label (e.g. The bags)", widget: string, required: false }
              - { name: title, label: "Headline", widget: text, hint: "Press Return to split it onto two lines." }
              - name: category
                label: "Category page it opens"
                widget: select
                default: "Bags"
                options:
                  - { label: "Bags", value: "Bags" }
                  - { label: "Accessories", value: "Accessories" }
                  - { label: "Sale", value: "sale" }
                  - { label: "Newest carousel", value: "all" }
              - { name: button, label: "Button text", widget: string, default: "Shop now" }
              - name: style
                label: "Text colour"
                widget: select
                default: "dark"
                options:
                  - { label: "White text (best on darker photos)", value: "dark" }
                  - { label: "Dark text (best on pale photos)", value: "light" }
          - { name: featuredHeading, label: "Featured carousel heading", widget: string, default: "Fresh off the hook" }
          - name: tiktok
            label: "TikTok videos block"
            widget: object
            fields:
              - { name: enabled, label: "Show my latest TikToks on the homepage", widget: boolean, default: true }
              - { name: heading, label: "Heading (optional)", widget: string, required: false, hint: "Leave empty for no heading — just the videos." }
            hint: "Shows your newest TikTok posts automatically — nothing to update, it follows your account. (Your TikTok link lives in Site settings.)"
          - name: story
            label: "Story block (near the bottom)"
            widget: object
            fields:
              - { name: image, label: "Photo (optional)", widget: image, required: false, hint: "Leave empty to show just the writing, on the left." }
              - { name: eyebrow, label: "Small label", widget: string, default: "Hello friend" }
              - { name: title, label: "Heading", widget: text, hint: "Press Return to split it onto two lines." }
              - { name: text, label: "Short intro (the full story lives on the About page)", widget: text }
              - { name: button, label: "Button text", widget: string, default: "Read my full story" }
          - name: newsletter
            label: "Email sign-up box"
            widget: object
            collapsed: true
            fields:
              - { name: enabled, label: "Show the email sign-up box", widget: boolean, default: false, hint: "Currently off. Switch on if you ever start a mailing list." }
              - { name: title, label: "Heading", widget: string, default: "First dibs" }
              - { name: text, label: "Text", widget: text }
              - { name: button, label: "Button text", widget: string, default: "Join" }
          - name: seo
            label: "Google & social sharing"
            widget: object
            collapsed: true
            fields:
              - { name: description, label: "Site description (shows under your link on Google/WhatsApp)", widget: text, required: false }

  - name: salepage
    label: "Sale page"
    description: "The Sale page wording, plus a switch to show or hide it. To put an item in the sale, set its 'Sale price' over in Products — it appears here on its own."
    editor: { preview: false }
    files:
      - name: sale
        label: "Sale page"
        file: "data/sale.json"
        fields:
          - { name: enabled, label: "Show the Sale page and menu link", widget: boolean, default: true, hint: "Turn off to hide the Sale tab everywhere — e.g. when nothing is on sale." }
          - { name: eyebrow, label: "Small label above the title", widget: string, default: "Deals", required: false }
          - { name: heading, label: "Title", widget: string, default: "Sale" }
          - { name: intro, label: "Intro line under the title", widget: text, required: false }

  - name: settings
    label: "Site settings"
    description: "Things that appear on every page — the scrolling announcement bar, social links and footer."
    editor: { preview: false }
    files:
      - name: settings
        label: "Site settings"
        file: "data/settings.json"
        fields:
          - name: ticker
            label: "Announcement bar messages (the scrolling strip at the top)"
            label_singular: "message"
            widget: list
            fields:
              - { name: text, label: "Message", widget: string }
          - { name: instagram, label: "Instagram link", widget: string }
          - { name: tiktok, label: "TikTok link", widget: string }
          - { name: footerBlurb, label: "Footer — short line about the shop", widget: text }
          - { name: footerTagline, label: "Footer — little sign-off line", widget: string, default: "Every stitch tells a story" }
          - { name: cartHint, label: "Basket note (small line above the Checkout button)", widget: string }
          - name: productMeta
            label: "Product page bullet points"
            label_singular: "bullet point"
            widget: list
            hint: "The three little reassurance lines shown on every product page."
            fields:
              - { name: text, label: "Line", widget: string }
          - { name: formspree, label: "Contact form ID (from formspree.io — ask your developer)", widget: string, required: false }
